apiVersion: v1
kind: Namespace
metadata:
  name: lab6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: lab6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: cmpe273-inventory:lab6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: lab6
spec:
  selector:
    app: inventory
  sessionAffinity: None
  ports:
    - name: http
      port: 5001
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab6
  labels:
    app: client
spec:
  containers:
    - name: client
      image: cmpe273-inventory:lab6
      imagePullPolicy: IfNotPresent
      command: ["python", "client.py"]
      env:
        - name: INVENTORY_URL
          value: http://inventory:5001
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
